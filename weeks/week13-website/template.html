<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drone Fleet Under Attack: Step Through the Demo</title>
<style>
:root{
  /* official JMU palette */
  --purple:#450084;   --gold:#CBB677;
  --purple-md:#B599CE; --purple-lt:#DACCE6;
  --gold-dk:#AD9C65;  --gold-lt:#F4EFE1;
  --slate:#333333;    --gray-dk:#595959; --gray-md:#B2B2B2; --gray-lt:#D6D6D6;
  --green:#5F791C;    --green-md:#ADCC23; --green-lt:#DEEBA7;
  --blue:#3C738B;     --blue-lt:#D2EBF5;
  --red:#A4232B;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--gold-lt)}
body{font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  color:var(--slate);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

header{flex:0 0 auto;padding:13px 24px 11px;background:var(--purple);color:#fff;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{margin:0;font-size:16.5px;font-weight:700;letter-spacing:-.01em;min-width:0}
header .t-mini{display:none}
header .step-of{margin-left:auto;font-size:12px;color:var(--purple-md);
  letter-spacing:.09em;text-transform:uppercase;font-weight:700;white-space:nowrap}

main{flex:1 1 auto;position:relative;min-height:0}
svg#stage{position:absolute;inset:0;width:100%;height:100%}

/* readouts. Shown by toggling display rather than fading opacity: an opacity
   transition stalls whenever the tab is not producing frames, which left the
   panel stuck invisible even though its state said otherwise. */
.hud{position:absolute;top:15px;left:18px;display:none;flex-direction:column;gap:9px;
  pointer-events:none}
.hud.on{display:flex}
.stat{background:#fff;border:1px solid var(--gray-lt);border-radius:10px;padding:9px 13px;
  min-width:150px;max-width:210px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.stat .k{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gray-dk);
  font-weight:700}
.stat .v{font-size:25px;font-weight:800;margin-top:1px;font-variant-numeric:tabular-nums;
  letter-spacing:-.02em;transition:color .4s}
.stat .s{font-size:11px;color:var(--gray-dk);margin-top:1px}
.stat.big .v{font-size:31px}

/* caption */
.cap{position:absolute;left:50%;transform:translateX(-50%);bottom:16px;
  background:#fff;border:1px solid var(--gray-lt);border-left:5px solid var(--purple);
  border-radius:0 12px 12px 0;padding:13px 20px;width:min(720px,92vw);
  box-shadow:0 2px 10px rgba(69,0,132,.09);transition:border-color .35s;
  /* fixed height so the card does not jump when a step's text wraps to two lines */
  min-height:100px;display:flex;flex-direction:column;justify-content:center}
.cap.bad{border-left-color:var(--red)}
.cap.ok{border-left-color:var(--green)}
.cap h2{margin:0 0 3px;font-size:15px;color:var(--purple);letter-spacing:-.01em}
.cap.bad h2{color:var(--red)} .cap.ok h2{color:var(--green)}
.cap p{margin:0;font-size:14px;color:var(--slate)}

footer{flex:0 0 auto;border-top:1px solid var(--gray-lt);background:#fff;
  padding:11px 24px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button{font:inherit;font-size:14px;font-weight:600;border-radius:9px;cursor:pointer;
  border:1.5px solid var(--gray-lt);background:#fff;color:var(--slate);
  padding:9px 16px;transition:.15s;display:inline-flex;align-items:center;gap:7px}
button:hover:not(:disabled){border-color:var(--purple);color:var(--purple)}
button:disabled{opacity:.38;cursor:default}
button:focus-visible,.dot:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button.pri{background:var(--purple);border-color:var(--purple);color:#fff;min-width:118px;
  justify-content:center}
button.pri:hover{background:#57009F;color:#fff}
button svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.4;
  stroke-linecap:round;stroke-linejoin:round}
.dots{display:flex;gap:1px;margin:0 auto}
.dot{width:26px;height:26px;border-radius:50%;background:none;cursor:pointer;
  border:0;padding:0;display:grid;place-items:center}
.dot::after{content:'';width:9px;height:9px;border-radius:50%;background:var(--gray-lt);
  transition:.25s}
.dot.on::after{background:var(--purple);transform:scale(1.3)}
.dot.seen::after{background:var(--purple-md)}
.dot:hover::after{background:var(--purple-md)}
footer .src{font-size:11px;color:var(--gray-dk);white-space:nowrap}

@media(max-width:760px){
  header{padding:10px 14px 9px;gap:6px}
  /* give the title its own full-width line so it wraps instead of running off,
     whatever font the device substitutes */
  header h1{font-size:13.5px;line-height:1.3;flex:1 1 100%}
  header .t-full{display:none} header .t-mini{display:inline}
  header .step-of{font-size:10.5px;margin-left:0;flex:1 1 100%}
  /* the readouts become a compact row so the stage keeps the height it needs */
  .hud{top:8px;left:8px;right:8px;flex-direction:row;gap:6px}
  .stat{min-width:0;max-width:none;flex:1;padding:6px 8px;border-radius:8px}
  .stat .k{font-size:8px;letter-spacing:.03em;overflow-wrap:anywhere} .stat .s{display:none}
  .stat .v{overflow-wrap:anywhere}
  .stat .v{font-size:16px} .stat.big .v{font-size:18px}
  .cap{padding:10px 13px;bottom:8px;left:8px;right:8px;width:auto;transform:none;
    border-radius:0 10px 10px 0}
  .cap h2{font-size:13px} .cap p{font-size:12px;line-height:1.45}
  footer{padding:8px 10px;gap:6px;justify-content:center}
  button{padding:8px 12px;font-size:13px} button.pri{min-width:0}
  footer .src{display:none} .dots{order:3;flex-basis:100%;justify-content:center;margin:0}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>

<header>
  <h1><span class="t-full">How two drones hide a blind spot, and how the coordinator finds them</span><span class="t-mini">Two drones hide a blind spot</span></h1>
  <div class="step-of" id="stepOf">Step 1 of 10</div>
</header>

<main>
  <svg id="stage" viewBox="0 0 1000 540" preserveAspectRatio="xMidYMid meet">
    <defs>
      <!-- quadcopter -->
      <symbol id="ico-drone" viewBox="0 0 64 64">
        <g fill="none" stroke="currentColor" stroke-width="3.2"
           stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="21" x2="45" y2="43"/><line x1="45" y1="21" x2="19" y2="43"/>
          <ellipse cx="15" cy="19" rx="9" ry="3.4"/><ellipse cx="49" cy="19" rx="9" ry="3.4"/>
          <ellipse cx="15" cy="45" rx="9" ry="3.4"/><ellipse cx="49" cy="45" rx="9" ry="3.4"/>
          <rect x="24" y="26" width="16" height="12" rx="3.5" fill="currentColor" stroke="none"/>
          <path d="M27 40 v4 M37 40 v4"/>
        </g>
      </symbol>
      <!-- ground station -->
      <symbol id="ico-hub" viewBox="0 0 64 64">
        <g fill="none" stroke="currentColor" stroke-width="3.2"
           stroke-linecap="round" stroke-linejoin="round">
          <rect x="16" y="34" width="32" height="20" rx="4"/>
          <line x1="32" y1="34" x2="32" y2="22"/>
          <path d="M20 20 a16 16 0 0 1 24 0"/>
          <path d="M25 26 a9 9 0 0 1 14 0"/>
          <circle cx="32" cy="19" r="2.6" fill="currentColor" stroke="none"/>
          <line x1="23" y1="44" x2="31" y2="44"/>
        </g>
      </symbol>
      <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="3.2"/>
      </filter>
    </defs>
  </svg>

  <div class="hud" id="hud">
    <div class="stat big">
      <div class="k">Attacker's gain</div>
      <div class="v" id="vLift">&#8211;</div>
      <div class="s">Versus no attack at all</div>
    </div>
    <div class="stat">
      <div class="k">Trigger let through</div>
      <div class="v" id="vBsr">&#8211;</div>
      <div class="s" id="vBsrSub">&nbsp;</div>
    </div>
    <div class="stat">
      <div class="k">Overall accuracy</div>
      <div class="v" id="vClean">&#8211;</div>
      <div class="s">What operators watch</div>
    </div>
  </div>

  <div class="cap" id="cap" role="status" aria-live="polite">
    <h2 id="capT">&nbsp;</h2>
    <p id="capP">&nbsp;</p>
  </div>
</main>

<footer>
  <button id="btnBack"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>Back</button>
  <button class="pri" id="btnNext">Next<svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
  <div class="dots" id="dots"></div>
  <button id="btnAuto"><svg viewBox="0 0 24 24" id="autoIco"><path d="M6 4l14 8-14 8z"/></svg><span id="autoTxt">Auto</span></button>
  <button id="btnReset"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>Restart</button>
  <span class="src" id="src">&nbsp;</span>
</footer>

<script>
const D = /*__DATA__*/null;
const $ = s => document.querySelector(s);
const NS = 'http://www.w3.org/2000/svg';
const mk = (n,a={}) => { const e=document.createElementNS(NS,n);
  for(const k in a) e.setAttribute(k,a[k]); return e; };

const C = {purple:'#450084', gold:'#CBB677', goldDk:'#AD9C65', purpleMd:'#B599CE', purpleLt:'#DACCE6',
           slate:'#333333', grayDk:'#595959', grayMd:'#B2B2B2', grayLt:'#D6D6D6',
           green:'#5F791C', greenLt:'#DEEBA7', red:'#A4232B', white:'#ffffff',
           goldLt:'#F4EFE1'};
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
// Two stage layouts. Landscape puts the fleet in 5x2 under the coordinator;
// on a phone that squeezes the drones to an unreadable size, so a portrait
// arrangement of 2x5 is used instead and the viewBox grows to match.
const NARROW = () => innerWidth < 760;
let HUB, VB;
function geom(){
  if(NARROW()){ HUB={x:310,y:76}; VB='0 0 620 1010'; }
  else        { HUB={x:500,y:92}; VB='0 0 1000 540'; }
}
geom();
const N=D.clients.length;
const stage=$('#stage');
let gLinks,gPackets,gDrones,gHub,gNotes,hubRing,hubBox,hubLbl,nodes=[];

const pos=i=> NARROW()
  ? ({x:170+(i%2)*280, y:228+((i/2)|0)*118})
  : ({x:196+(i%5)*152, y:262+((i/5)|0)*112});

/* ------------------------------------------------------------- build --- */
function build(){
  geom();
  stage.setAttribute('viewBox', VB);
  [...stage.children].filter(n=>n.tagName==='g').forEach(g=>g.remove());
  nodes=[];
  gLinks=mk('g'); gPackets=mk('g'); gDrones=mk('g'); gHub=mk('g'); gNotes=mk('g');
  stage.append(gLinks,gPackets,gHub,gDrones,gNotes);

  for(let i=0;i<N;i++){
    const p=pos(i);
    gLinks.appendChild(mk('line',{x1:p.x,y1:p.y-26,x2:HUB.x,y2:HUB.y+30,
      stroke:'#DFD7C8','stroke-width':1.6}));
  }

  hubRing=mk('circle',{cx:HUB.x,cy:HUB.y,r:56,fill:'none',stroke:C.purple,
    'stroke-width':3,opacity:0});
  hubBox=mk('rect',{x:HUB.x-96,y:HUB.y-40,width:192,height:80,rx:14,
    fill:C.white,stroke:C.purple,'stroke-width':2});
  const hIco=mk('use',{href:'#ico-hub',x:HUB.x-84,y:HUB.y-26,width:52,height:52,
    color:C.purple});
  const hT=mk('text',{x:HUB.x+18,y:HUB.y-4,'text-anchor':'middle',fill:C.purple,
    'font-size':13.5,'font-weight':700}); hT.textContent='COORDINATOR';
  hubLbl=mk('text',{x:HUB.x+18,y:HUB.y+14,'text-anchor':'middle',fill:C.grayDk,
    'font-size':11}); hubLbl.textContent='Merging what it is sent';
  gHub.append(hubRing,hubBox,hIco,hT,hubLbl);

  const legend=mk('text',{x:NARROW()?310:500, y:NARROW()?772:432,'text-anchor':'middle',
    fill:C.grayDk,'font-size':NARROW()?15:11.5});
  legend.textContent='Bar under each drone is its influence in the merge';
  gDrones.appendChild(legend);

  for(let i=0;i<N;i++){
    const c=D.clients[i], p=pos(i), g=mk('g');
    const box=mk('rect',{x:p.x-48,y:p.y-34,width:96,height:72,rx:12,
      fill:C.white,stroke:C.grayLt,'stroke-width':1.6});
    const ico=mk('use',{href:'#ico-drone',x:p.x-21,y:p.y-31,width:42,height:42,
      color:C.purple});
    const nm=mk('text',{x:p.x,y:p.y+18,'text-anchor':'middle',fill:C.grayDk,
      'font-size':12,'font-weight':700}); nm.textContent=c.id;
    const bg=mk('rect',{x:p.x-34,y:p.y+25,width:68,height:7,rx:3.5,fill:'#EDE7DB'});
    const fg=mk('rect',{x:p.x-34,y:p.y+25,width:34,height:7,rx:3.5,fill:C.purpleMd});
    g.append(box,ico,nm,bg,fg); gDrones.appendChild(g);
    nodes.push({...c,p,box,ico,nm,fg});
  }
}

/* -------------------------------------------------------- primitives --- */
function paintDrones({flagBad=false, trust=null}={}){
  const uni=1/N, MAX=.16;
  nodes.forEach(n=>{
    const bad = flagBad && n.attacker;
    n.box.setAttribute('stroke', bad?C.red:C.grayLt);
    n.box.setAttribute('fill',   bad?'#FBF0F1':C.white);
    n.ico.setAttribute('color',  bad?C.red:C.purple);
    n.nm.setAttribute('fill',    bad?C.red:C.grayDk);
    const t = trust==='measured' ? n.trust : uni;
    n.fg.setAttribute('width', Math.max(2,(t/MAX)*68));
    n.fg.setAttribute('fill', (trust==='measured'&&n.attacker)?C.red:C.purpleMd);
  });
}
function flyPackets(bad){
  gPackets.innerHTML='';
  if(REDUCED) return;                 // no travelling dots for reduced-motion users
  nodes.forEach((n,i)=>setTimeout(()=>{
    if(!alive) return;
    const isBad = bad && n.attacker;
    const d=mk('circle',{cx:n.p.x,cy:n.p.y-26,r:isBad?6.5:5,
      fill:isBad?C.red:C.purpleMd,filter:'url(#soft)'});
    gPackets.appendChild(d);
    const t0=performance.now(), dur=780;
    (function step(now){
      const k=Math.min(1,(now-t0)/dur), e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
      d.setAttribute('cx', n.p.x+(HUB.x-n.p.x)*e);
      d.setAttribute('cy', (n.p.y-26)+((HUB.y+30)-(n.p.y-26))*e);
      if(k<1) requestAnimationFrame(step); else d.remove();
    })(t0);
    setTimeout(()=>d.remove(), dur+400);   // rAF pauses on hidden tabs
  }, i*70));
}
function pulse(colour){
  if(REDUCED) return;
  hubRing.setAttribute('stroke',colour);
  const t0=performance.now();
  (function step(now){
    const k=Math.min(1,(now-t0)/760);
    hubRing.setAttribute('r',56+38*k);
    hubRing.setAttribute('opacity',String(.9*(1-k)));
    if(k<1) requestAnimationFrame(step);
  })(t0);
}
// A pill badge rather than a bare word floating on the canvas: sized to its own
// text, so it reads as a deliberate label at any zoom.
function pill(x,y,text,fg,bg,size){
  size = size || 11.5;
  const g=mk('g');
  const t=mk('text',{x,y,'text-anchor':'middle','dominant-baseline':'central',
    fill:fg,'font-size':size,'font-weight':700,'letter-spacing':'.02em'});
  t.textContent=text;
  g.appendChild(t); gNotes.appendChild(g);
  const w=t.getComputedTextLength()+24, h=size+13;
  g.insertBefore(mk('rect',{x:x-w/2,y:y-h/2,width:w,height:h,rx:h/2,
    fill:bg,stroke:fg,'stroke-width':1.4}), t);
  return g;   // drawn opaque: a rAF fade stalls whenever the tab is not painting
}
function clearNotes(){ gNotes.innerHTML=''; }

function showStats(key, tone){
  const s=D.states[key];
  $('#hud').classList.add('on');
  $('#vLift').textContent  = (s.lift>=0?'+':'−')+Math.abs(s.lift).toFixed(3);
  $('#vBsr').textContent   = (s.bsr*100).toFixed(1)+'%';
  $('#vClean').textContent = (s.clean*100).toFixed(1)+'%';
  $('#vBsrSub').textContent= 'An honest model: '+(D.states.honest.bsr*100).toFixed(1)+'%';
  $('#vLift').style.color  = tone==='bad'?C.red:(tone==='ok'?C.green:C.slate);
  $('#vBsr').style.color   = tone==='bad'?C.red:C.slate;
  $('#src').textContent    = 'Measured: '+s.method+' · mean of 3 seeds';
}
function hideStats(){ $('#hud').classList.remove('on'); $('#src').textContent=''; }

/* ------------------------------------------------------------- steps --- */
let alive=true;
const STEPS=[
{ t:'Ten drones, one shared detector',
  p:'Each aircraft watches its own GPS signals for spoofing. A coordinator on the ground keeps a single shared model that all of them use.',
  run(){ clearNotes(); hideStats(); paintDrones(); hubLbl.textContent='Merging what it is sent'; }},

{ t:'Every drone learns on its own data',
  p:'No raw signal data ever leaves an aircraft. That is the whole point of training this way.',
  run(){ clearNotes(); hideStats(); paintDrones();
    nodes.forEach((n,i)=>setTimeout(()=>{ if(alive) n.box.setAttribute('stroke',C.purpleMd); },i*55));
  }},

{ t:'Once a round, they send up what they learned',
  p:'Only the model’s numbers travel, about 13 KB per drone. The coordinator cannot see anyone’s data, so it cannot check how it was produced.',
  run(){ clearNotes(); hideStats(); paintDrones(); flyPackets(false);
    setTimeout(()=>{ if(alive) pulse(C.purple); },900); }},

{ t:'The coordinator merges them into one model',
  p:'It averages all ten contributions and sends the improved model back down. Then the whole cycle repeats, twelve times.',
  run(){ clearNotes(); hideStats(); paintDrones(); pulse(C.purple);
    hubLbl.textContent='Merging what it is sent'; }},

{ t:'But two of these drones have been taken over',
  p:'C9 and C10 are controlled by an attacker. Nothing about their messages looks unusual from the outside.',
  run(){ clearNotes(); hideStats(); paintDrones({flagBad:true}); }},

{ t:'They do three things at once',
  p:'They poison part of their training data, amplify their update so it survives the averaging, and lie about how accurate they are to get a bigger say.',
  run(){ clearNotes(); paintDrones({flagBad:true}); hideStats();
    const a=nodes[8].p, b=nodes[9].p;
    pill((a.x+b.x)/2, a.y-58, 'Poisoned data  ·  Amplified update  ·  False accuracy', C.red, '#FBF0F1'); }},

{ t:'The backdoor is in the shared model',
  p:'Now a spoofing signal carrying the attacker’s trigger gets waved through. Overall accuracy barely moved, so nothing on a dashboard looks wrong.',
  run(){ clearNotes(); paintDrones({flagBad:true}); flyPackets(true);
    hubLbl.textContent='Merging what it is sent';
    setTimeout(()=>{ if(!alive)return; pulse(C.red); showStats('attack','bad'); },900); }},

{ t:'Now the coordinator stops taking their word for it',
  p:'Instead of believing what a drone reports about itself, it quizzes every model on a small set of signals it keeps privately.',
  run(){ clearNotes(); paintDrones({flagBad:true}); hideStats();
    hubLbl.textContent='Running its own exam'; pulse(C.gold);
    pill(HUB.x, HUB.y+66, 'Tests every model on data only it holds', C.goldDk, '#FBF7EC'); }},

{ t:'The two liars fail the exam',
  p:'An honest model still spots the spoofing. A backdoored one slips on exactly one question: the one matching its hidden trigger.',
  run(){ clearNotes(); paintDrones({flagBad:true}); hideStats();
    hubLbl.textContent='Running its own exam';
    nodes.filter(n=>n.attacker).forEach((n,k)=>setTimeout(()=>{
      if(!alive) return;
      n.box.setAttribute('stroke-width','3.6');
      setTimeout(()=>n.box.setAttribute('stroke-width','1.6'),520);
    }, 180+k*220));
    nodes.filter(n=>n.attacker).forEach((n,k)=>setTimeout(()=>{
      if(alive) pill(n.p.x, n.p.y-48, 'FLAGGED', C.red, '#FBF0F1', 11);
    }, 280+k*170)); }},

{ t:'They get no say, and the attack gains nothing',
  p:'Both are held at zero influence from the first round. The attacker ends up no better off than if it had never attacked at all.',
  run(){ clearNotes(); paintDrones({flagBad:true, trust:'measured'});
    hubLbl.textContent='Model is clean'; pulse(C.green);
    showStats('full','ok'); }},
];

let idx=0, auto=null;

function render(){
  alive=true;
  // Self-heal if the viewport crossed the layout breakpoint without firing a
  // resize event (some embedded viewers change size without one), otherwise the
  // stage keeps a stale portrait or landscape geometry.
  if(NARROW()!==wasNarrow){ wasNarrow=NARROW(); build(); }
  const s=STEPS[idx];
  $('#capT').textContent=s.t; $('#capP').textContent=s.p;
  $('#stepOf').textContent=`Step ${idx+1} of ${STEPS.length}`;
  const cap=$('#cap');
  cap.className='cap'+(idx===6?' bad':(idx===9?' ok':''));
  s.run();
  $('#btnBack').disabled = idx===0;
  $('#btnNext').disabled = idx===STEPS.length-1;
  [...$('#dots').children].forEach((d,i)=>{
    d.className='dot'+(i===idx?' on':(i<idx?' seen':''));
    d.setAttribute('aria-current', i===idx ? 'step' : 'false');
  });
  const want='#'+(idx+1);
  if(location.hash!==want) history.replaceState(null,'',want);
}
function go(i){
  alive=false;                       // cancel any in-flight callbacks
  gPackets.innerHTML='';
  idx=Math.max(0,Math.min(STEPS.length-1,i));
  render();          // synchronous: rAF is paused on hidden tabs, so a deferred
                     // render would leave the step buttons doing nothing

}

$('#dots').innerHTML = STEPS.map((_,i)=>`<button class="dot" data-i="${i}" aria-label="Step ${i+1}"></button>`).join('');
$('#dots').addEventListener('click',e=>{const b=e.target.closest('.dot'); if(b){stopAuto();go(+b.dataset.i);}});
$('#btnNext').addEventListener('click',()=>{stopAuto();go(idx+1);});
$('#btnBack').addEventListener('click',()=>{stopAuto();go(idx-1);});
$('#btnReset').addEventListener('click',()=>{stopAuto();go(0);});

function stopAuto(){ if(auto){clearInterval(auto); auto=null;
  $('#autoTxt').textContent='Auto'; $('#autoIco').innerHTML='<path d="M6 4l14 8-14 8z"/>';} }
$('#btnAuto').addEventListener('click',()=>{
  if(auto){ stopAuto(); return; }
  $('#autoTxt').textContent='Pause';
  $('#autoIco').innerHTML='<path d="M7 4v16M17 4v16"/>';
  if(idx===STEPS.length-1) go(0);
  auto=setInterval(()=>{ if(idx>=STEPS.length-1){stopAuto();return;} go(idx+1); }, 5200);
});
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'){stopAuto();go(idx+1);}
  if(e.key==='ArrowLeft'){stopAuto();go(idx-1);}
});

function fromHash(){
  const n=parseInt((location.hash||'').replace('#',''),10);
  return Number.isFinite(n) && n>=1 && n<=STEPS.length ? n-1 : 0;
}
addEventListener('hashchange',()=>{ const n=fromHash(); if(n!==idx){stopAuto();go(n);} });

let wasNarrow=NARROW(), rsz;
build();
idx=fromHash();
render();

addEventListener('resize',()=>{
  clearTimeout(rsz);
  rsz=setTimeout(()=>{ if(NARROW()!==wasNarrow){ wasNarrow=NARROW(); build(); render(); } },160);
});
</script>
</body>
</html>
